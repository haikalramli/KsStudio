# ====================================================
# KS.Studio Application Configuration
# ====================================================

# Database Configuration
# Update these values to match your Oracle database
db.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
db.username=KSSTUDIOADMIN
db.password=admin
db.driver=oracle.jdbc.OracleDriver

# Connection Pool Settings
db.pool.minSize=5
db.pool.maxSize=20
db.pool.timeout=30000

# Application Settings
app.name=KS.Studio
app.version=1.0-SNAPSHOT
app.environment=development

# Session Configuration
session.timeout=30

# File Upload Settings
upload.maxFileSize=10485760
upload.allowedTypes=jpg,jpeg,png,gif,webp
upload.directory=/uploads

# Logging
logging.level=INFO
